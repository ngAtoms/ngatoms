name: Release

on:
  pull_request:
    branches:
      - main
      - lts
      - rc
  push:
    branches:
      - main
      - lts
      - rc

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present

  release:
    name: Release (${{ github.ref_name }})
    needs: ci
    if: github.event_name == 'push' && contains(fromJSON('["main","lts","rc"]'), github.ref_name)
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The CLI downloads source pinned to this commit. Only first-party code
      # runs here (no dependencies, no npm lifecycle hooks); a failure stops
      # the job before staging.
      - name: Pin CLI source
        run: |
          node packages/ngatoms/scripts/pin-source.mjs
          node packages/ngatoms/scripts/pin-source.mjs --check

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Enter LTS pre-release mode
        if: github.ref_name == 'lts'
        run: npm run pre:enter:lts

      - name: Version packages
        run: npm run version:packages

      - name: Commit version bump
        run: |
          git add -A
          git commit -m "chore: version packages" || echo "nothing to commit"

      # The version bump must not change the files the pin hashed.
      - name: Check pin still matches
        run: |
          git diff --exit-code "$GITHUB_SHA" HEAD -- registry packages/tokens/src packages/primitives/src
          node packages/ngatoms/scripts/pin-source.mjs --check

      - name: Stage packages for approval
        run: |
          npm install -g npm@12.2.2
          # setup-node writes an empty _authToken. npm then reports E401
          # and does not use the Actions OIDC token.
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "$NPM_CONFIG_USERCONFIG" ]]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
          real="$(command -v npm)"
          mkdir -p "$RUNNER_TEMP/npm-bin"
          cp tools/scripts/npm-stage-publish-wrapper.sh "$RUNNER_TEMP/npm-bin/npm"
          chmod +x "$RUNNER_TEMP/npm-bin/npm"
          export NGATOMS_REAL_NPM="$real"
          export PATH="$RUNNER_TEMP/npm-bin:$PATH"
          hash -r
          npm --version
          npm run publish:changesets
          {
            echo "### Packages staged"
            echo "These versions are not public yet. Approve each one with 2FA:"
            echo "1. On npmjs.com, open the package and use the Staged Packages tab."
            echo "2. Or locally, after \`npm login\`: \`npm stage list <package>\` and then \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git push --follow-tags "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${REF_NAME}"

      - name: Exit LTS pre-release mode
        if: success() && github.ref_name == 'lts'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          npm run pre:exit
          git add -A
          git commit -m "chore: exit prerelease mode" || echo "nothing to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${REF_NAME}"
